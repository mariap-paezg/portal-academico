<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto | Portal Académico</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>

    <header>
      <h1>Contacto</h1>
      <p>Programación Web · Ingeniería de Sistemas</p>
    </header>
    <nav aria-label="Menú principal">
      <ul class="nav-list">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="datos.html">Cronograma</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
    <main id="contenido" class="layout-2col">
      <div class="content">
        <section class="card" aria-labelledby="t-contacto">
          <h2 id="t-contacto">Formulario de consulta</h2>
          <form action="#" method="get">
            <fieldset>
              <legend>Datos del estudiante</legend>
              <label for="nombre">Nombre completo</label>
              <input
                type="text"
                id="nombre"
                name="nombre"
                required
                autocomplete="name"
              />
              <label for="correo">Correo institucional</label>
              <input
                type="email"
                id="correo"
                name="correo"
                required
                aria-describedby="ayuda-correo"
              />
              <p id="ayuda-correo">Usa tu correo institucional.</p>
              <label for="telefono">Teléfono (opcional)</label>
              <input type="tel" id="telefono" name="telefono" />
            </fieldset>

            <fieldset>
              <legend>Tu consulta</legend>
              <label for="tipo">Tipo de consulta</label>
              <select id="tipo" name="tipo" required>
                <option value="">Selecciona una opción</option>
                <option value="tema">Dudas sobre un tema</option>
                <option value="proyecto">Proyecto del curso</option>
                <option value="otro">Otro</option>
              </select>
              <label for="fecha">Fecha</label>
              <input type="date" id="fecha" name="fecha" />
              <label for="mensaje">Mensaje</label>
              <textarea
                id="mensaje"
                name="mensaje"
                rows="4"
                required
              ></textarea>
            </fieldset>
            <button type="submit">Enviar consulta</button>
          </form>
        </section>
      </div>
    </main>
    <footer>
      <p>© 2026 Portal Académico</p>
      <address>Contacto: docente@ejemplo.edu</address>
    </footer>
  </body>
</html>
